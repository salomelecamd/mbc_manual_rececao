project:
  type: website
  output-dir: docs        # pasta que o GitHub Pages publica

website:
  title: "Manual da receção"
  page-navigation: false

format:
  html:
    lang: pt-PT
    theme: darkly
    css: estilo.css
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@500;600&display=swap">
    toc: true
    toc-title: "Neste manual"
    toc-depth: 2
    toc-location: left
    number-sections: false
    smooth-scroll: true
    fig-align: center
    lightbox: true        # clicar num print abre-o em grande
